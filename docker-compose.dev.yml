services:
  postgres:
    build:
      context: ./docker/postgres
    image: valolabs-crm-postgres:16-pgvector-dev
    container_name: base_crm_postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5436}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-streaming_crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-streaming_crm}
      POSTGRES_DB: ${POSTGRES_DB:-streaming_crm}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app_network

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: base_crm_web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-streaming_crm}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-streaming_crm}
      - POSTGRES_DB=${POSTGRES_DB:-streaming_crm}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-streaming_crm}:${POSTGRES_PASSWORD:-streaming_crm}@postgres:5432/${POSTGRES_DB:-streaming_crm}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_network

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: base_crm_cloudflared_tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - app_network
    depends_on:
      - web

volumes:
  postgres_data:

networks:
  app_network:
    driver: bridge
